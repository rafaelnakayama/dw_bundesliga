name: cicd

on:
  schedule:
    - cron: "0 21 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  bca87534df: # Escolhido arbitrariamente
    name: new_matches
    runs-on: ubuntu-latest

    steps:
      # MODO DE TESTE: tres valores apontam para a feature branch em vez da main
      # e os steps de Pages estao fora. Reverter os tres juntos no merge.
      - uses: actions/checkout@v5
        with:
          ref: feature/dashboard
          fetch-depth: 1
          persist-credentials: true

      # Parte do .env.example para a lista de variaveis ter uma fonte so: uma
      # variavel nova entra no CI sem ninguem lembrar deste step. O banco vive
      # apenas neste job, entao a senha e descartavel e nao vale um secret, e o
      # sufixo garante as regras de complexidade do SQL Server.
      - name: env_file
        run: sed "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 16)Aa1!|" .env.example > .env

      # O compose sobe o banco e roda o entrypoint, que faz fetch, bronze,
      # silver e gold. Nao usa FETCH_ONLY=1: o export precisa do gold pronto.
      - name: build_warehouse
        run: docker compose run --rm python_ingestion

      # Dentro do container, onde o driver ODBC ja existe. No runner exigiria
      # instalar o msodbcsql18 so para gerar um JSON.
      - name: export_dashboard_data
        run: docker compose run --rm python_ingestion python dashboard/export_gold.py

      - name: check
        id: bka7798984es # Escolhido arbitrariamente
        run: |
          if [ -n "$(git status --porcelain datasets/raw dashboard/data)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: user
        if: steps.bka7798984es.outputs.changed == 'true'
        run: |
          git config user.name "rafaelnakayama"
          git config user.email "rafaelnakayama2003@gmail.com"
          git add datasets/raw dashboard/data
          git commit -m "chore: weekly fetch update"
          git push origin feature/dashboard

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: render_dashboard
        working-directory: dashboard
        run: uv run --group dashboard quarto render
