project:
  type: website
  output-dir: _site

website:
  title: "Bundesliga Data Warehouse"
  repo-url: https://github.com/rafaelnakayama/dw_bundesliga
  repo-actions: [source]

format:
  html:
    theme: cosmo
    # Plotly loads from CDN instead of being inlined. Keeps index.html near
    # 100 KB rather than 3 MB, which matters if the build output is ever
    # committed instead of deployed from an Actions artifact.
    embed-resources: false
