services:
  data_warehouse_db:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    ports:
      - "1433:1433"
    restart: unless-stopped
    volumes:
      - mssql_data:/var/opt/mssql
  python_ingestion:
    environment:
      - DB_SERVER=data_warehouse_db
    # depends_on e ordem de INICIALIZACAO, nao fluxo de dados. O banco e um
    # servidor: sobe sozinho e nao precisa de ninguem. O script nao consegue
    # abrir conexao se o banco nao estiver de pe, entao quem depende e ele.
    # Cuidado: nesta forma simples, so espera o container INICIAR, nao o SQL
    # Server ficar pronto para aceitar conexao (~20s de diferenca).
    depends_on:
      - data_warehouse_db
    build: . # Colocar . para casos em que o compose ta na mesma pasta
    env_file: .env
    restart: no
  
volumes:
  mssql_data: